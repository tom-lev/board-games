<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משחקים</title>
<style>
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px; background: #12151f; color: #e8ecf4;
    font-family: system-ui, "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; align-items: center;
  }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 720px; }
  a.card {
    display: block; width: 300px; padding: 18px 20px; border-radius: 14px; text-decoration: none; color: inherit;
    background: #1b2133; border: 1px solid #2f3852; transition: transform .15s, border-color .15s;
  }
  a.card:hover { transform: translateY(-3px); border-color: #ffd166; }
  a.card h2 { margin: 0 0 6px; }
  a.card p { margin: 0; color: #9aa4ba; line-height: 1.5; }
</style>
</head>
<body>
  <h1>משחקי לוח</h1>
  <div class="grid">
    <a class="card" href="grid-lockout/index.html">
      <h2>תחרות מסלולים</h2>
      <p>לוח 6×6. כל צעד הופך את המשבצת שעזבת לבור. האחרון שעוד יכול לזוז מנצח.</p>
    </a>
    <a class="card" href="stones-and-gusts/index.html">
      <h2>אבנים ורוחות</h2>
      <p>לוח 5×5 עם 4 אבנים לכל שחקן. מניחים אבן או נושפים שורה שלמה. שלוש ברצף מנצחות.</p>
    </a>
  </div>
</body>
</html>
